name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify installable package and update manifest
        run: python3 scripts/verify-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: asktranslate-${{ github.sha }}
          path: |
            build/asktranslate.xpi
            build/update*.json
            build/SHA256SUMS
            LICENSE
            NOTICE
            build/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14

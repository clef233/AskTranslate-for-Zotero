name: Release

on:
  push:
    tags: ["asktranslate-v*"]

permissions:
  contents: write

concurrency:
  group: asktranslate-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check version tag
        run: |
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "asktranslate-v$version"
      - run: npm ci
      - run: npm run build
      - name: Verify installable package and update manifest
        run: python3 scripts/verify-release.py
      - name: Publish version and update manifests
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
